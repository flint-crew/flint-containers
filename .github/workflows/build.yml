# Build and test every image; publish on release or manual run.
#
# Pull requests and pushes to main build and test only. A release (or a manual
# run) also pushes to ghcr.io/flint-crew/<image> with these tags:
#   <tag>             portable build: amd64 (x86-64) and arm64 (armv8-a)
#   <tag>-x86-64-v3   amd64 with AVX2
#   <tag>-x86-64-v4   amd64 with AVX-512
# Images without CPU-specific builds (aegean, casa, askapsoft, rclone) get the
# -x86-64-v3/-v4 tags as copies of the portable image, so any tag can be
# pulled for every image.
name: Build images

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/flint-crew
  CACHE_REF: ghcr.io/flint-crew/flint-containers-cache
  # Pull requests write their own cache (read before main's) instead of main's
  CACHE_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}
  PUBLISH: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install actionlint-py hadolint-py shellcheck-py ruff
      - run: hadolint docker/*/Dockerfile
      - run: actionlint
      - run: shellcheck tests/*.sh
      - run: ruff check .
      - run: ruff format --check .
      - run: docker buildx bake --print > /dev/null
      # Reads the upstream build files at the pinned versions and fails here,
      # before the long builds start, if they can't work together.
      - name: Check that the pinned versions fit together
        run: python tools/try_build.py check --verbose --summary "${GITHUB_STEP_SUMMARY}"

  tag:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="$(git describe --tags --abbrev=0 2>/dev/null || echo dev)-$(git rev-parse --short HEAD)"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${tag}"

  build:
    needs: [lint, tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            march: x86-64
            suffix: ""
            group: default
            images: calibrate wsclean aoflagger potato aegean casa askapsoft rclone
            cpu_flag: ""
          - name: amd64-v3
            runner: ubuntu-24.04
            platform: linux/amd64
            march: x86-64-v3
            suffix: -x86-64-v3
            group: compiled
            images: calibrate wsclean aoflagger potato
            cpu_flag: avx2
          - name: amd64-v4
            runner: ubuntu-24.04
            platform: linux/amd64
            march: x86-64-v4
            suffix: -x86-64-v4
            group: compiled
            images: calibrate wsclean aoflagger potato
            cpu_flag: avx512f
          - name: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            march: armv8-a
            suffix: ""
            group: arm64
            images: calibrate wsclean aoflagger potato aegean rclone
            cpu_flag: ""
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      MARCH: ${{ matrix.march }}
      PLATFORMS: ${{ matrix.platform }}
      TAGS: ci
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      # Published images always download the measures and CASA data again.
      # Other runs download them once a day, so that runs on the same day
      # share one build cache.
      - name: Choose when to download the measures and CASA data again
        run: |
          if [[ "${PUBLISH}" == "true" ]]; then
            refresh="${{ github.run_id }}"
          else
            refresh="$(date -u +%F)"
          fi
          echo "MEASURES_REFRESH=${refresh}" >> "$GITHUB_ENV"
          echo "CASA_DATA_REFRESH=${refresh}" >> "$GITHUB_ENV"

      # The images plus build cache need more space than the runner has free.
      # Deleting takes about 2 minutes, so it runs behind the steps that follow.
      - name: Free disk space
        run: |
          sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            > /dev/null 2>&1 &

      # x86-64-v4 binaries need AVX-512, which GitHub's runners may not have.
      - name: Can this runner run the binaries?
        id: cpu
        run: |
          if [[ -z "${{ matrix.cpu_flag }}" ]] || grep -qw "${{ matrix.cpu_flag }}" /proc/cpuinfo; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Runner CPU lacks ${{ matrix.cpu_flag }}; ${{ matrix.march }} images are built but not tested."
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run calibrate's test suite
        if: steps.cpu.outputs.run == 'true'
        uses: docker/bake-action@v7
        with:
          source: .
          targets: test
        env:
          CACHE_REF: ${{ env.CACHE_REF }}

      - name: Build
        uses: docker/bake-action@v7
        with:
          source: .
          targets: ${{ matrix.group }}
          load: true
        env:
          CACHE_REF: ${{ env.CACHE_REF }}
          CACHE_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Smoke tests
        if: steps.cpu.outputs.run == 'true'
        run: |
          for image in ${{ matrix.images }}; do
            echo "::group::${image}"
            tests/smoke.sh "${image}" "${REGISTRY}/${image}:ci"
            echo "::endgroup::"
          done

      - name: Image sizes
        run: |
          {
            echo "### ${{ matrix.name }} (${{ matrix.march }})"
            echo "| Image | Size (uncompressed) |"
            echo "|---|---|"
            for image in ${{ matrix.images }}; do
              size=$(docker image inspect --format '{{.Size}}' "${REGISTRY}/${image}:ci")
              echo "| ${image} | $(numfmt --to=iec "${size}") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python for the flint tests
        if: steps.cpu.outputs.run == 'true' && matrix.platform == 'linux/amd64'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Apptainer
        if: steps.cpu.outputs.run == 'true' && matrix.platform == 'linux/amd64'
        uses: eWaterCycle/setup-apptainer@v3

      # askapsoft is CSIRO's image, which only changes with ASKAPSOFT_IMAGE, and
      # converting it to an Apptainer file takes about 7 minutes. Keep the file,
      # keyed on the image's layers.
      - name: Cache key for the askapsoft Apptainer file
        id: askapsoft-sif
        if: steps.cpu.outputs.run == 'true' && matrix.platform == 'linux/amd64' && contains(matrix.images, 'askapsoft')
        run: |
          layers=$(docker image inspect --format '{{json .RootFS.Layers}}' "${REGISTRY}/askapsoft:ci" | sha256sum | cut -c1-16)
          echo "key=askapsoft-sif-${layers}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        if: steps.askapsoft-sif.outputs.key
        with:
          path: containers/flint-containers_askapsoft.sif
          key: ${{ steps.askapsoft-sif.outputs.key }}

      - name: Run flint's container call sites
        if: steps.cpu.outputs.run == 'true' && matrix.platform == 'linux/amd64'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Install flint while the images are converted
          python -m pip install "askap-flint[casa] @ git+https://github.com/flint-crew/flint@main" pytest \
            > pip-install.log 2>&1 &
          pip_pid=$!
          mkdir -p containers
          # One at a time: conversions that run together corrupt Apptainer's
          # shared cache, and are no faster.
          for image in ${{ matrix.images }}; do
            sif="containers/flint-containers_${image}.sif"
            if [[ -f "${sif}" ]]; then
              echo "Using cached ${sif}"
            else
              apptainer build "${sif}" "docker-daemon://${REGISTRY}/${image}:ci"
            fi
            docker image rm "${REGISTRY}/${image}:ci"
          done
          if ! wait "${pip_pid}"; then cat pip-install.log; exit 1; fi
          python -m pytest tests/flint_compat -v -rs \
            --container-dir containers \
            --expect "$(tr ' ' ',' <<<"${{ matrix.images }}")"

      # Portable builds are pushed by digest and joined into one multi-arch
      # tag by the publish job; CPU-specific builds are amd64-only and tagged here.
      # The metadata goes to a file: it is too big for an environment variable
      # (several hundred KB), and also holds entries that are not targets, such
      # as the list of build warnings.
      - name: Push portable images by digest
        if: env.PUBLISH == 'true' && matrix.suffix == ''
        run: |
          docker buildx bake ${{ matrix.group }} \
            --set "*.output=type=image,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json
          mkdir -p digests
          jq -r 'to_entries[] | select(.value | type == "object") | select(.value["containerimage.digest"])
                 | "\(.key) \(.value["containerimage.digest"])"' \
            metadata.json > "digests/${{ matrix.name }}.txt"
          cat "digests/${{ matrix.name }}.txt"
          # An empty file would give the publish job nothing to tag
          test -s "digests/${{ matrix.name }}.txt"

      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true' && matrix.suffix == ''
        with:
          name: digests-${{ matrix.name }}
          path: digests/

      - name: Push CPU-specific images
        if: env.PUBLISH == 'true' && matrix.suffix != ''
        uses: docker/bake-action@v7
        with:
          source: .
          targets: ${{ matrix.group }}
          push: true
        env:
          CACHE_REF: ${{ env.CACHE_REF }}
          TAGS: ${{ github.event_name == 'release' && format('{0},latest', needs.tag.outputs.tag) || needs.tag.outputs.tag }}
          TAG_SUFFIX: ${{ matrix.suffix }}

  publish:
    needs: [tag, build]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tags
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          LATEST: ${{ github.event_name == 'release' }}
        run: |
          for image in calibrate wsclean aoflagger potato aegean casa askapsoft rclone; do
            sources=$(awk -v img="${image}" '$1 == img {print ENVIRON["REGISTRY"] "/" img "@" $2}' digests/*.txt)
            tags=(-t "${REGISTRY}/${image}:${TAG}")
            if [[ "${LATEST}" == "true" ]]; then tags+=(-t "${REGISTRY}/${image}:latest"); fi
            # shellcheck disable=SC2086
            docker buildx imagetools create "${tags[@]}" ${sources}
          done

      - name: Copy portable images to the CPU-specific tags
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          LATEST: ${{ github.event_name == 'release' }}
        run: |
          for image in aegean casa askapsoft rclone; do
            for suffix in -x86-64-v3 -x86-64-v4; do
              tags=(-t "${REGISTRY}/${image}:${TAG}${suffix}")
              if [[ "${LATEST}" == "true" ]]; then tags+=(-t "${REGISTRY}/${image}:latest${suffix}"); fi
              docker buildx imagetools create "${tags[@]}" "${REGISTRY}/${image}:${TAG}"
            done
          done
