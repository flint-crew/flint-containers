# Build images with versions that are not in docker-bake.hcl yet, such as a new
# release or an upstream branch, without opening a pull request.
#
# Run it from the Actions tab: Try versions > Run workflow opens a form with a
# box per tool. Fill in the versions to try (a tag, branch or commit) and leave
# the rest empty to keep the versions pinned in docker-bake.hcl. Or:
#   gh workflow run try.yml -f wsclean=master -f everybeam=v0.9.1
#
# The check job reads the upstream build files and stops within a minute or so
# if the versions can't work together (tools/try_build.py check). The build job
# then builds only the images the versions change, for amd64 only, and runs the
# smoke tests and, optionally, flint's container call sites. With "push", the
# images are pushed as ghcr.io/flint-crew/<image>:try-<label>.
name: Try versions

on:
  workflow_dispatch:
    # Each box is one docker-bake.hcl variable. Empty keeps the pinned version.
    inputs:
      casacore:
        description: "casacore: tag, branch or commit of github.com/casacore/casacore (e.g. v3.8.2)"
        required: false
        default: ""
        type: string
      python_casacore:
        description: "python-casacore: github.com/casacore/python-casacore (e.g. v3.8.1)"
        required: false
        default: ""
        type: string
      wsclean:
        description: "wsclean: gitlab.com/aroffringa/wsclean (e.g. master)"
        required: false
        default: ""
        type: string
      everybeam:
        description: "EveryBeam: git.astron.nl/RD/EveryBeam (e.g. v0.9.1)"
        required: false
        default: ""
        type: string
      idg:
        description: "IDG: git.astron.nl/RD/idg (e.g. 1.2.0)"
        required: false
        default: ""
        type: string
      aoflagger:
        description: "aoflagger: gitlab.com/aroffringa/aoflagger"
        required: false
        default: ""
        type: string
      calibrate:
        description: "calibrate: github.com/flint-crew/calibrate (a commit or branch)"
        required: false
        default: ""
        type: string
      potato:
        description: "potato: gitlab.com/Sunmish/potato (a commit or branch)"
        required: false
        default: ""
        type: string
      aegean:
        description: "Aegean: github.com/PaulHancock/Aegean"
        required: false
        default: ""
        type: string
      casa:
        description: "casatasks version on PyPI (e.g. 6.7.6.14)"
        required: false
        default: ""
        type: string
      rclone:
        description: "rclone: github.com/rclone/rclone (e.g. v1.76.0)"
        required: false
        default: ""
        type: string
      other:
        description: "Any other docker-bake.hcl variables, as NAME=VALUE separated by spaces (e.g. BUILD_NUMPY=2.3.0)"
        required: false
        default: ""
        type: string
      images:
        description: "Images to build, separated by spaces. Leave empty to build every image the versions change."
        required: false
        default: ""
        type: string
      flint_tests:
        description: "Run flint's container call sites (adds about 5 to 15 minutes)"
        type: boolean
        default: true
      push:
        description: "Push the images to ghcr.io/flint-crew/<image>:try-<label>"
        type: boolean
        default: false
      label:
        description: "Label for the pushed tags (try-<label>). Leave empty to use the run number."
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/flint-crew
  CACHE_REF: ghcr.io/flint-crew/flint-containers-cache
  # Tries read main's build cache and write their own, never main's.
  CACHE_SCOPE: try

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.check.outputs.versions }}
      images: ${{ steps.check.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Inputs go through the environment, not into the script text, and
      # try_build.py only accepts known variable names and plain ref characters.
      - name: Check that the versions fit together
        id: check
        env:
          IN_CASACORE: ${{ inputs.casacore }}
          IN_PYTHON_CASACORE: ${{ inputs.python_casacore }}
          IN_WSCLEAN: ${{ inputs.wsclean }}
          IN_EVERYBEAM: ${{ inputs.everybeam }}
          IN_IDG: ${{ inputs.idg }}
          IN_AOFLAGGER: ${{ inputs.aoflagger }}
          IN_CALIBRATE: ${{ inputs.calibrate }}
          IN_POTATO: ${{ inputs.potato }}
          IN_AEGEAN: ${{ inputs.aegean }}
          IN_CASA: ${{ inputs.casa }}
          IN_RCLONE: ${{ inputs.rclone }}
          OTHER: ${{ inputs.other }}
          IMAGES: ${{ inputs.images }}
        run: |
          versions=()
          for name in CASACORE PYTHON_CASACORE WSCLEAN EVERYBEAM IDG AOFLAGGER CALIBRATE POTATO AEGEAN CASA RCLONE; do
            value="IN_${name}"
            value="${!value//[[:space:]]/}"
            if [[ -n "${value}" ]]; then versions+=("${name}=${value}"); fi
          done
          read -r -a other <<<"${OTHER}"
          versions+=("${other[@]}")
          if [[ ${#versions[@]} -eq 0 ]]; then
            echo "::error::Fill in at least one version to try."
            exit 1
          fi
          python tools/try_build.py check --verbose --images "${IMAGES}" \
            --summary "${GITHUB_STEP_SUMMARY}" --github-output "${GITHUB_OUTPUT}" "${versions[@]}"

  build:
    needs: check
    if: needs.check.outputs.images != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSIONS: ${{ needs.check.outputs.versions }}
      IMAGES: ${{ needs.check.outputs.images }}
      TAG: try-${{ inputs.label || github.run_number }}
      CACHE_PUSH: "true"
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The images plus build cache need more space than the runner has free.
      # Deleting takes about 2 minutes, so it runs behind the steps that follow.
      - name: Free disk space
        run: |
          sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            > /dev/null 2>&1 &

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One bake for all the images (and calibrate's tests if calibrate is one),
      # so the first failure anywhere stops the run.
      - name: Build and smoke test
        run: |
          # shellcheck disable=SC2086 # VERSIONS is split into NAME=REF words on purpose
          python tools/try_build.py build --no-check --smoke --images "${IMAGES}" --tag "${TAG}" ${VERSIONS}

      - name: Set up Apptainer
        if: inputs.flint_tests
        uses: eWaterCycle/setup-apptainer@v3

      # uv and a Python environment that the later steps use as "python"
      - name: Set up uv for the flint tests
        if: inputs.flint_tests
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true

      - name: Run flint's container call sites
        if: inputs.flint_tests
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Install flint while the images are converted
          uv pip install "askap-flint[casa] @ git+https://github.com/flint-crew/flint@main" pytest \
            > pip-install.log 2>&1 &
          pip_pid=$!
          mkdir -p containers
          # One at a time: conversions that run together corrupt Apptainer's
          # shared cache, and are no faster.
          for image in ${IMAGES}; do
            apptainer build "containers/flint-containers_${image}.sif" "docker-daemon://${REGISTRY}/${image}:${TAG}"
            docker image rm "${REGISTRY}/${image}:${TAG}"
          done
          if ! wait "${pip_pid}"; then cat pip-install.log; exit 1; fi
          python -m pytest tests/flint_compat -v -rs \
            --container-dir containers \
            --expect "$(tr ' ' ',' <<<"${IMAGES}")"

      # Everything is in the build cache by now, so this only uploads.
      - name: Push
        if: inputs.push
        run: |
          # shellcheck disable=SC2086 # VERSIONS is split into NAME=REF words on purpose
          python tools/try_build.py build --no-check --push --images "${IMAGES}" --tag "${TAG}" ${VERSIONS}
          {
            echo "### Pushed"
            echo '```bash'
            for image in ${IMAGES}; do
              echo "apptainer pull docker://${REGISTRY}/${image}:${TAG}"
            done
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
