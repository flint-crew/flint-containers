# Delete what the builds leave behind on ghcr.io.
#
# Once a day, the build cache of pull requests closed more than a day ago:
# the <name>-pr-<number> tags of flint-containers-cache, which nothing reads
# again. Not at once: a cache that is identical to main's is one registry
# version with both tags, and deleting the version deletes main's tag too.
# The run on main that a merge starts can add main's tag at any moment until
# it finishes, so the clean-up waits a day and checks the tags again just
# before it deletes.
#
# Run it by hand to delete the images of a manual "Build images" run, which
# are tagged <last release>-<commit>, or the cache of a closed pull request:
#   gh workflow run cleanup.yml -f tag=v1.4.0-1a2b3c4
#   gh workflow run cleanup.yml -f pull_request=13
# Release tags can't be deleted this way.
name: Clean up

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of a manual build to delete from every image, e.g. v1.4.0-1a2b3c4"
        required: false
        default: ""
        type: string
      pull_request:
        description: "Number of a closed pull request whose build cache to delete"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  PACKAGES: /orgs/flint-crew/packages/container

jobs:
  cache:
    if: github.event_name == 'schedule' || inputs.pull_request != ''
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      pull-requests: read
    steps:
      - name: Delete the build cache of closed pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty on the daily run: every pull request closed a day ago
          NUMBER: ${{ inputs.pull_request }}
        run: |
          if [[ -n "${NUMBER}" && ! "${NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::'${NUMBER}' is not a pull request number."
            exit 1
          fi
          day_ago=$(date -u -d '1 day ago' +%s)
          declare -A gone
          # Whether pull request $1's cache may go, asked of GitHub once
          is_gone() {
            if [[ -z "${gone[$1]+x}" ]]; then
              local closed
              closed=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$1" --jq '.closed_at // ""' || true)
              gone[$1]=0
              if [[ -n "${closed}" ]] && { [[ -n "${NUMBER}" ]] || (( $(date -u -d "${closed}" +%s) < day_ago )); }; then
                gone[$1]=1
              fi
            fi
            [[ "${gone[$1]}" == 1 ]]
          }
          # Every tag of a version must be such a pull request's, or it stays
          deletable() {
            local tag
            for tag in "$@"; do
              [[ "${tag}" =~ -pr-([0-9]+)$ ]] || return 1
              [[ -z "${NUMBER}" || "${BASH_REMATCH[1]}" == "${NUMBER}" ]] || return 1
              is_gone "${BASH_REMATCH[1]}" || return 1
            done
          }
          versions="${PACKAGES}/flint-containers-cache/versions"
          gh api --paginate "${versions}?per_page=100" |
            jq -r '.[] | select(.metadata.container.tags | length > 0)
              | "\(.id) \(.metadata.container.tags | join(" "))"' > versions.txt
          while read -r id tags; do
            # shellcheck disable=SC2086 # one word per tag
            deletable ${tags} || continue
            # Main's tag may have been added since the list was read
            now=$(gh api "${versions}/${id}" --jq '.metadata.container.tags | join(" ")')
            if [[ "${now}" != "${tags}" ]]; then
              echo "Kept ${tags}: its tags are now ${now}"
              continue
            fi
            gh api -X DELETE "${versions}/${id}"
            echo "Deleted ${tags}"
          done < versions.txt

  images:
    if: inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Delete the images of a manual build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${TAG}" =~ ^(v[0-9.]+|dev)-[0-9a-f]{7,12}$ ]]; then
            echo "::error::'${TAG}' is not the tag of a manual build (<last release>-<commit>)."
            exit 1
          fi
          # A version is deleted only if every tag it has belongs to that
          # build. The untagged per-platform images under it are left: another
          # tag may share them.
          for image in calibrate wsclean aoflagger potato aegean casa askapsoft rclone; do
            gh api --paginate "${PACKAGES}/${image}/versions?per_page=100" |
              jq -r --arg tag "${TAG}" '.[] | .metadata.container.tags as $tags
                | select(($tags | length) > 0 and ($tags | all(. == $tag or startswith($tag + "-x86-64-v"))))
                | "\(.id) \($tags | join(" "))"' |
              while read -r id tags; do
                gh api -X DELETE "${PACKAGES}/${image}/versions/${id}"
                echo "Deleted ${image}: ${tags}"
              done
          done
