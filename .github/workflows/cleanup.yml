# Delete what the builds leave behind on ghcr.io.
#
# When a pull request closes, its build cache is deleted: the <name>-pr-<number>
# tags of flint-containers-cache, which nothing reads again.
#
# Run it by hand to delete the images of a manual "Build images" run, which
# are tagged <last release>-<commit>, for example v1.4-1a2b3c4:
#   gh workflow run cleanup.yml -f tag=v1.4-1a2b3c4
# Release tags can't be deleted this way.
name: Clean up

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of a manual build to delete from every image, e.g. v1.4-1a2b3c4"
        required: true
        type: string

permissions:
  contents: read

env:
  PACKAGES: /orgs/flint-crew/packages/container

jobs:
  cache:
    # A fork's pull request has no cache of its own
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Delete the pull request's build cache
        env:
          GH_TOKEN: ${{ github.token }}
          SUFFIX: -pr-${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "${PACKAGES}/flint-containers-cache/versions?per_page=100" |
            jq -r --arg suffix "${SUFFIX}" '.[] | .metadata.container.tags as $tags
              | select(($tags | length) > 0 and ($tags | all(endswith($suffix))))
              | "\(.id) \($tags | join(" "))"' |
            while read -r id tags; do
              gh api -X DELETE "${PACKAGES}/flint-containers-cache/versions/${id}"
              echo "Deleted ${tags}"
            done

  images:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Delete the images of a manual build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${TAG}" =~ ^(v[0-9.]+|dev)-[0-9a-f]{7,12}$ ]]; then
            echo "::error::'${TAG}' is not the tag of a manual build (<last release>-<commit>)."
            exit 1
          fi
          # A version is deleted only if every tag it has belongs to that
          # build. The untagged per-platform images under it are left: another
          # tag may share them.
          for image in calibrate wsclean aoflagger potato aegean casa askapsoft rclone; do
            gh api --paginate "${PACKAGES}/${image}/versions?per_page=100" |
              jq -r --arg tag "${TAG}" '.[] | .metadata.container.tags as $tags
                | select(($tags | length) > 0 and ($tags | all(. == $tag or startswith($tag + "-x86-64-v"))))
                | "\(.id) \($tags | join(" "))"' |
              while read -r id tags; do
                gh api -X DELETE "${PACKAGES}/${image}/versions/${id}"
                echo "Deleted ${image}: ${tags}"
              done
          done
